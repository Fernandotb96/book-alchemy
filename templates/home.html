<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Book Alchemy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
  <div class="page">

    <h1>Book Alchemy</h1>
    <p class="tagline">Your library, cataloged.</p>

    <div class="toolbar">
      <form class="search-form" action="/" method="GET">
        <input type="text" name="search" placeholder="Search by title..." value="{{ search_query or '' }}">
        <input type="hidden" name="sort_by" value="{{ sort_by }}">
        <input type="submit" value="Search">
      </form>

      <div class="sort-links">
        Sort by:
        <a class="{{ 'active' if sort_by == 'title' else '' }}" href="/?sort_by=title&search={{ search_query }}">Title</a>
        <a class="{{ 'active' if sort_by == 'author' else '' }}" href="/?sort_by=author&search={{ search_query }}">Author</a>
      </div>
    </div>

    {% if message %}
      <p class="message">{{ message }}</p>
    {% endif %}

    <div class="book-grid">
      {% for book in books %}
      <div class="book-card">
        <p class="book-title">{{ book.title }}</p>
        <p class="book-author">{{ book.author.name }}</p>
        <p class="book-meta">{{ book.publication_year }}{% if book.isbn %} · ISBN {{ book.isbn }}{% endif %}</p>
        <form class="delete-form" action="{{ url_for('delete_book', book_id=book.id) }}" method="POST">
          <button type="submit" onclick="return confirm('Are you sure you want to delete this book?');">Delete</button>
        </form>
      </div>
      {% endfor %}
    </div>

  </div>
  </body>
</html>
